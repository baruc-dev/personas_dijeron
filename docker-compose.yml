version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: game-database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: game-database
      MYSQL_USER: barucsudo
      MYSQL_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: game-web
    ports:
      - "8819:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpgame-v2
    restart: always
    ports:
      - "8818:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data:
